<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOM Practice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Browser Object Model (BOM)</h1>

    <!-- LOCATION OBJECT -->
    <h2>Location Object</h2>

    <button id="currentURL">Show Current URL</button>

    <button id="google">Redirect to Google</button>

    <button id="reload">Reload Page</button>

    <hr>

    <!-- HISTORY OBJECT -->
    <h2>History Object</h2>

    <button id="back">Go Back</button>

    <button id="forward">Go Forward</button>

    <hr>

    <!-- SCREEN OBJECT -->
    <h2>Screen Object</h2>

    <button id="screenInfo">Show Screen Info</button>

    <hr>

    <!-- NAVIGATOR OBJECT -->
    <h2>Navigator Object</h2>

    <button id="browserInfo">Browser Info</button>

    <button id="onlineStatus">Online Status</button>

    <hr>

    <!-- DIALOG BOXES -->
    <h2>Dialog Boxes</h2>

    <button id="alertBtn">Show Alert</button>

    <button id="confirmBtn">Show Confirm</button>

    <button id="promptBtn">Show Prompt</button>

    <hr>

    <!-- TIMERS -->
    <h2>Timers</h2>

    <button id="timeoutBtn">Set Timeout</button>

    <button id="clearTimeoutBtn">Clear Timeout</button>

    <button id="intervalBtn">Start Interval</button>

    <button id="clearIntervalBtn">Stop Interval</button>

    <hr>

    <h2>Output</h2>

    <p id="output">Output will appear here...</p>

    <script src="index.js"></script>

</body>
</html>
